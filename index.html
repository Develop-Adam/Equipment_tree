<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipment Tree Viewer</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Buildings</h1>
        <p>Pick a building</p>
      </div>
      <nav id="buildingList" class="building-list" aria-label="Buildings"></nav>
      <div class="sidebar-footer">
        <p>Press <strong>F</strong> to refit the map.</p>
      </div>
    </aside>

    <main class="viewer-shell">
      <div class="viewer-header">
        <div>
          <h2 id="viewerTitle">Loading…</h2>
          <p id="viewerSubtitle">Drag empty space to pan. Scroll to zoom.</p>
        </div>
      </div>
      <section id="mapViewport" class="map-viewport" aria-label="Equipment map"></section>
    </main>

    <aside class="details-panel" id="detailsPanel">
      <h2>Details</h2>
      <div id="detailsContent" class="details-content">
        <p>Select an item in the diagram.</p>
      </div>
    </aside>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
